# ATTENZIONE — questo flusso non parte piu' da solo.
#
# Il suo gemello per Windows produceva un pacchetto che va in crash all'avvio
# (0xC0000409), e nessuno qui puo' provare un AppImage: senza una macchina Linux
# su cui aprirlo, pubblicarlo vuol dire dare alla gente qualcosa che non si sa
# se funziona. Si lancia a mano, e chi lo lancia lo prova.
name: Release Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.17.08

permissions:
  contents: write

jobs:
  appimage:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            linuxdeploy_arch: x86_64
          - arch: aarch64
            runner: ubuntu-26.04-arm
            linuxdeploy_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Qt x86_64
        if: matrix.arch == 'x86_64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: linux_gcc_64
          modules: "qtmultimedia qtpositioning qtlocation qtserialport qtwebsockets"
          cache: true

      - name: Install x86_64 dependencies
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            file \
            fuse \
            libfuse2 \
            libgl1-mesa-dev \
            libsecret-1-dev \
            libxkbcommon-dev \
            ninja-build \
            patchelf \
            wget

      - name: Build qtkeychain x86_64
        if: matrix.arch == 'x86_64'
        run: |
          git clone --depth 1 --branch 0.17.0 https://github.com/frankosterfeld/qtkeychain.git /tmp/qtkeychain
          cmake -S /tmp/qtkeychain -B /tmp/qtkeychain/build -G Ninja -DBUILD_WITH_QT6=ON -DBUILD_TRANSLATIONS=OFF -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR"
          cmake --build /tmp/qtkeychain/build
          cmake --install /tmp/qtkeychain/build

      - name: Install aarch64 dependencies
        if: matrix.arch == 'aarch64'
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          apt-cache policy qt6-location-dev
          sudo apt-get install -y \
            build-essential \
            cmake \
            file \
            fuse \
            libfuse2 \
            ninja-build \
            patchelf \
            wget \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-location-dev \
            qt6-l10n-tools \
            qt6-multimedia-dev \
            qt6-positioning-dev \
            qt6-serialport-dev \
            qt6-tools-dev \
            qt6-websockets-dev \
            qtkeychain-qt6-dev \
            libssl-dev

      - name: Configure x86_64
        if: matrix.arch == 'x86_64'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build/bin"

      - name: Configure aarch64
        if: matrix.arch == 'aarch64'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build/bin"

      - name: Build
        run: cmake --build build --parallel 3 --target decolog

      - name: Install into AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build

      - name: Add desktop metadata
        run: |
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp resources/decodxlog.png AppDir/usr/share/icons/hicolor/256x256/apps/decodxlog.png
          cat > AppDir/usr/share/applications/decodxlog.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DecoDXLog
          Exec=DecoDXLog
          Icon=decodxlog
          Categories=Network;HamRadio;
          EOF

      - name: Download linuxdeploy
        run: |
          wget -O linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage"
          wget -O linuxdeploy-plugin-qt "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.linuxdeploy_arch }}.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Remove optional Mimer SQL driver
        if: matrix.arch == 'x86_64'
        run: |
          mimer_driver="$QT_ROOT_DIR/plugins/sqldrivers/libqsqlmimer.so"
          if [ -f "$mimer_driver" ]; then
            rm -f "$mimer_driver"
          fi

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QML_SOURCES_PATHS: qml:libs/decodium-ui/qml
          VERSION: ${{ inputs.tag }}
        run: |
          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/DecoDXLog \
            --desktop-file AppDir/usr/share/applications/decodxlog.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/decodxlog.png \
            --plugin qt \
            --output appimage
          version="${{ inputs.tag }}"
          version="${version#v}"
          mkdir -p release-assets
          mv DecoDXLog-*.AppImage "release-assets/DecoDXLog-$version-linux-${{ matrix.arch }}.AppImage"

      - name: Sign Linux package for automatic updates
        env:
          DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY: ${{ secrets.DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY" > "$key_file"
          version="${{ inputs.tag }}"
          version="${version#v}"
          cmake --build build --target decodxlog_sign
          build/bin/decodxlog_sign sign --key-file "$key_file" \
            --repository elisir80/DecodxLog --version "$version" --out release-assets \
            "release-assets/DecoDXLog-$version-linux-${{ matrix.arch }}.AppImage"
          mv release-assets/decodxlog-release.json "release-assets/decodxlog-release-linux-${{ matrix.arch }}.json"
          mv release-assets/decodxlog-release.json.sig "release-assets/decodxlog-release-linux-${{ matrix.arch }}.json.sig"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "DecoDXLog $TAG_NAME" --notes "DecoDXLog $TAG_NAME"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG_NAME" release-assets/* --clobber
