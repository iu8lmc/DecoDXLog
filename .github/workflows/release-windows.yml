# Windows si costruisce soltanto a richiesta e con la stessa catena MSYS2/MinGW
# con cui viene provato il pacchetto reale. La vecchia catena MSVC produceva un
# eseguibile che usciva subito con 0xC0000409; non va rimessa qui finche' non e'
# stata capita e verificata su una macchina Windows vera.
#
# Prima si scarica l'artefatto, si prova DecoDXLog.exe, e solo in una seconda
# esecuzione manuale con publish=true si allegano gli asset alla release. Il
# Il setup viene pubblicato con il nome standard solo con publish=true, dopo
# prova reale. Viene firmato insieme al manifest del fork, cosi' l'auto-update
# puo' installare solo l'artefatto esplicitamente approvato.
name: Release Windows (manual MinGW)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag sorgente e release destinataria
        required: true
        default: v1.17.42
        type: string
      publish:
        description: Ho provato l'artefatto Windows e autorizzo la pubblicazione
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (MSYS2 MinGW)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          # Build exactly the same tagged snapshot as the other platforms.
          ref: ${{ inputs.tag }}

      - name: Install MSYS2 MinGW and Qt
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-positioning
            mingw-w64-x86_64-qt6-location
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qtkeychain
            mingw-w64-x86_64-openssl

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Configure
        run: cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECODXLOG_REQUIRE_OPENSSL=ON

      - name: Build
        run: cmake --build build-rel --parallel 3 --target decolog

      - name: Release gate
        env:
          QT_QPA_PLATFORM: offscreen
          # MinGW's local-interface subprocess teardown is flaky on the
          # hosted Windows image: the product and installer smoke test remain
          # covered, while the full gate is retained on every other test.
          DECODXLOG_CTEST_EXCLUDE_REGEX: udppipeline
        run: bash scripts/release-gate.sh build-rel build-rel/DecoDXLog.exe build-rel/decodxlog-capabilities.json

      - name: Package with the tested MinGW procedure
        run: MINGW=/mingw64 BUILD="$PWD/build-rel" bash scripts/installer.sh

      - name: Prepare assets for review
        id: assets
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          mkdir -p release-assets
          cp "DecoDXLog-$version-setup.exe" "release-assets/DecoDXLog-$version-windows-x64-setup.exe"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Smoke-test final installer
        shell: pwsh
        env:
          VERSION: ${{ steps.assets.outputs.version }}
        run: |
          $installer = Join-Path $PWD "DecoDXLog-$env:VERSION-setup.exe"
          if (!(Test-Path $installer)) { throw "Installer not found: $installer" }
          $installRoot = Join-Path $env:RUNNER_TEMP "DecoDXLog-smoke"
          if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }
          $proc = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installRoot") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed with exit code $($proc.ExitCode)" }
          $exe = Join-Path $installRoot 'DecoDXLog.exe'
          if (!(Test-Path $exe)) { throw "Installed executable not found: $exe" }
          $png = Join-Path $env:RUNNER_TEMP 'decodxlog-smoke.png'
          $app = Start-Process -FilePath $exe -ArgumentList @('--show','badge','--grab',$png) -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Installed application exited with code $($app.ExitCode)" }
          if (!(Test-Path $png) -or ((Get-Item $png).Length -le 0)) { throw "Installed application did not produce a PNG" }

      - name: Sign the approved Windows installer
        if: inputs.publish
        env:
          DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY: ${{ secrets.DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY" > "$key_file"
          version="${{ steps.assets.outputs.version }}"
          cmake --build build-rel --target decodxlog_sign
          sign_tool=build-rel/decodxlog_sign
          [ -x "$sign_tool.exe" ] && sign_tool="$sign_tool.exe"
          "$sign_tool" sign --key-file "$key_file" \
            --repository elisir80/DecodxLog --version "$version" --out release-assets \
            "release-assets/DecoDXLog-$version-windows-x64-setup.exe"
          mv release-assets/decodxlog-release.json release-assets/decodxlog-release-windows-x86_64.json
          mv release-assets/decodxlog-release.json.sig release-assets/decodxlog-release-windows-x86_64.json.sig

      - name: Upload artefacts to test before publication
        uses: actions/upload-artifact@v4
        with:
          name: DecoDXLog-${{ steps.assets.outputs.version }}-windows-x64-MinGW-test
          path: release-assets/
          if-no-files-found: error

      - name: Upload reviewed release assets
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          gh release view "$env:TAG_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG_NAME" --title "DecoDXLog $env:TAG_NAME" --generate-notes
          }
          gh release upload "$env:TAG_NAME" release-assets\* --clobber
