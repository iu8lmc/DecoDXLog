# ATTENZIONE — questo flusso non parte piu' da solo.
#
# Il suo gemello per Windows produceva un pacchetto che va in crash all'avvio
# (0xC0000409), e nessuno qui puo' provare un .dmg. Si lancia a mano, e chi lo
# lancia lo prova.
name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.17.08
      arch:
        description: Architettura da costruire (all, arm64, x86_64)
        required: true
        default: all
        type: choice
        options: [all, arm64, x86_64]

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.arch == 'arm64' && 'apple-silicon' || 'intel' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-14' || 'macos-15-intel' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'all' && '["arm64", "x86_64"]' || format('["{0}"]', inputs.arch)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install dependencies
        run: brew install cmake ninja qt qtkeychain openssl@3 brotli webp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix qtkeychain)" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --parallel 3 --target decolog

      - name: Deploy app bundle
        run: |
          export PATH="$(brew --prefix qt)/bin:$PATH"
          # Le formule Homebrew tengono WebP, Sharpyuv e Brotli fuori dal
          # prefisso Qt: dichiararle esplicitamente evita rpath irrisolti sul
          # runner Intel. La firma la facciamo dopo il deploy.
          macdeployqt build/DecoDXLog.app \
            -qmldir=qml \
            -qmldir=libs/decodium-ui/qml \
            -libpath="$(brew --prefix brotli)/lib" \
            -libpath="$(brew --prefix webp)/lib" \
            -no-codesign \
            -verbose=1

          version="${{ inputs.tag }}"
          version="${version#v}"
          mkdir -p release-assets

          # Non abbiamo un certificato Developer ID, quindi questa non rende
          # l'app notarizzata. Pero' macOS 26 rifiuta il binario linker-signed
          # lasciato da clang quando il bundle non ha il suo CodeResources:
          # una firma ad-hoc dell'intero bundle sigilla risorse e dipendenze.
          codesign --force --deep --sign - --timestamp=none build/DecoDXLog.app
          codesign --verify --deep --strict --verbose=2 build/DecoDXLog.app

          hdiutil create -volname "DecoDXLog $version" \
            -srcfolder build/DecoDXLog.app \
            -ov -format UDZO \
            "release-assets/DecoDXLog-$version-macos-${{ matrix.arch }}.dmg"

      - name: Sign macOS package for automatic updates
        env:
          DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY: ${{ secrets.DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DECODXLOG_ELISIR80_RELEASE_SIGNING_KEY" > "$key_file"
          version="${{ inputs.tag }}"
          version="${version#v}"
          # QSysInfo chiama Apple Silicon "arm64", ma l'auto-update lo
          # normalizza in "aarch64". Il nome del manifest deve usare la forma
          # normalizzata, altrimenti il DMG viene trovato ma non la sua firma.
          manifest_arch="${{ matrix.arch }}"
          [ "$manifest_arch" = "arm64" ] && manifest_arch="aarch64"
          cmake --build build --target decodxlog_sign
          build/decodxlog_sign sign --key-file "$key_file" \
            --repository elisir80/DecodxLog --version "$version" --out release-assets \
            "release-assets/DecoDXLog-$version-macos-${{ matrix.arch }}.dmg"
          mv release-assets/decodxlog-release.json "release-assets/decodxlog-release-macos-$manifest_arch.json"
          mv release-assets/decodxlog-release.json.sig "release-assets/decodxlog-release-macos-$manifest_arch.json.sig"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "DecoDXLog $TAG_NAME" --notes "DecoDXLog $TAG_NAME"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG_NAME" release-assets/* --clobber
